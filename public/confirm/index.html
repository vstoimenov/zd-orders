<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Моята поръчка</title>
<style>
:root{--ink:#14140f;--muted:#6d6c66;--line:#e6e4dc;--accent:#facc15;--ok:#15803d;--bad:#b91c1c;--soft:#fafaf7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:16px;background:#f4f4f1;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:440px;align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.shop{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
h1{font-size:21px;margin:2px 0 2px}
.muted{color:var(--muted);font-size:13px}
.state{display:flex;gap:12px;align-items:center;background:#fffbe6;border:1px solid #f4e08a;border-radius:14px;padding:12px 14px;margin:16px 0}
.state.end{background:var(--soft);border-color:var(--line)}
.state .ic{font-size:28px;line-height:1}
.state b{display:block;font-size:16px}
.office{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin:0 0 14px}
.office b{display:block;font-size:15px}
.btns{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.btn{flex:1 1 140px;text-align:center;border-radius:12px;padding:12px;font-weight:800;font-size:14px;text-decoration:none;color:#111;border:1px solid var(--line);background:#fff}
.btn.y{background:var(--accent);border-color:var(--accent)}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:flex;gap:12px;position:relative;padding:0 0 16px}
.tl li:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .d{flex:0 0 24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--line);color:#999}
.tl li.done .d{background:var(--accent);color:#111}
.tl li.done:before{background:var(--accent)}
.tl li.now .d{background:#111;color:var(--accent);box-shadow:0 0 0 4px #fde68a}
.tl b{display:block;font-size:14.5px}
.tl span{font-size:12.5px;color:var(--muted)}
.tl li.todo b{color:#aaa}
h2{font-size:15px;margin:18px 0 6px}
ul.items{margin:6px 0;padding:0;list-style:none;border-top:1px solid var(--line)}
ul.items li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.total{font-weight:800;font-size:16px;display:flex;justify-content:space-between;margin:8px 0 2px}
.where{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0 16px;font-size:14px}
button{width:100%;padding:14px;border-radius:12px;border:1px solid transparent;font:inherit;font-weight:800;cursor:pointer}
.yes{background:var(--accent);color:#111;margin-bottom:10px}
.no{background:#fff;border-color:#f3c6cb;color:var(--bad)}
button:disabled{opacity:.6;cursor:default}
.ask{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:6px}
.err{color:var(--bad);margin-top:10px}
.foot{margin-top:16px;text-align:center;font-size:12px;color:#a3a29b}
</style>
</head>
<body>
<div class="card" id="card"><div class="muted">Зареждам…</div></div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  // /confirm/?t=… (the confirmation link) or /p/<token> (the short tracking link)
  var t = p.get('t') || (location.pathname.match(/^\/p\/([A-Za-z0-9_-]{30,64})\/?$/) || [])[1] || '';
  var API = p.get('demo') ? '/api/demo/confirm' : '/api/admin/confirm';
  var card = document.getElementById('card');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(v, c) { return Number(v).toFixed(2).replace('.', ',') + ' ' + (c === 'EUR' ? '€' : c); }
  function when(iso, withTime) {
    if (!iso) return '';
    var o = { timeZone: 'Europe/Sofia', day: '2-digit', month: '2-digit' };
    if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return new Date(iso).toLocaleString('bg-BG', o);
  }
  function stateBox(d) {
    var tr = d.tracking, locker = tr.courier === 'boxnow';
    var S = {
      placed: ['🧾', 'Поръчката е приета', esc(d.shop) + ' я подготвя.'],
      confirmed: ['✅', 'Поръчката е потвърдена', esc(d.shop) + ' ще я изпрати скоро.'],
      packed: ['📦', 'Поръчката е опакована', 'Скоро тръгва към теб.'],
      shipped: ['🚚', 'Пратката пътува към теб', tr.courierText ? esc(tr.courierName) + ': „' + esc(tr.courierText) + '“' + (tr.checkedAt ? ' · ' + esc(when(tr.checkedAt, true)) : '') : 'Изпратена с ' + esc(tr.courierName || 'куриер') + '.'],
      at_office: ['📍', locker ? 'Пратката те чака в автомата' : 'Пратката те чака в офиса', 'от ' + esc(when(tr.atOfficeSince)) + ' · вземи я, преди да се върне'],
      delivered: ['🎉', 'Получена', 'Благодарим за поръчката!'],
      cancelled: ['👋', 'Поръчката е отказана', 'Ако е грешка — свържи се с ' + esc(d.shop) + '.'],
      returned: ['↩️', 'Пратката е върната към магазина', 'За въпроси — свържи се с ' + esc(d.shop) + '.'],
    }[tr.stage] || ['📦', 'Поръчката е при нас', ''];
    var end = ['delivered', 'cancelled', 'returned'].indexOf(tr.stage) >= 0;
    return '<div class="state' + (end ? ' end' : '') + '"><span class="ic">' + S[0] + '</span><div><b>' + S[1] + '</b><span class="muted">' + S[2] + '</span></div></div>';
  }
  function officeBox(tr) {
    var f = tr.office;
    if (!f || ['shipped', 'at_office'].indexOf(tr.stage) < 0) return '';
    var dest = f.lat != null && f.lng != null ? f.lat + ',' + f.lng : (f.address ? f.address + ', ' : '') + f.city;
    var maps = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
    return '<div class="office"><b>' + esc(tr.courierName ? tr.courierName + ' · ' : '') + esc(f.name) + '</b>' + esc([f.address, f.city].filter(Boolean).join(', ')) +
      (f.hours ? '<br><span class="muted">' + esc(f.hours) + '</span>' : '') +
      '<div class="btns"><a class="btn' + (tr.stage === 'at_office' ? ' y' : '') + '" href="' + esc(maps) + '" target="_blank" rel="noopener">🧭 Упътване</a></div></div>';
  }
  function timeline(d) {
    var tr = d.tracking, locker = tr.courier === 'boxnow';
    var L = {
      placed: 'Поръчката е приета', confirmed: 'Потвърдена', packed: 'Опакована',
      shipped: tr.courierName ? 'Изпратена с ' + tr.courierName : 'Изпратена',
      at_office: locker ? 'Чака те в автомата' : 'Чака те в офиса', delivered: 'Получена',
    };
    var stopped = ['cancelled', 'returned'].indexOf(tr.stage) >= 0;
    var now = -1;
    tr.steps.forEach(function (s, i) { if (s.done) now = i; });
    return '<ul class="tl">' + tr.steps.map(function (s, i) {
      var cls = s.done ? (i === now && !stopped && s.key !== 'delivered' ? 'now' : 'done') : 'todo';
      var sub = [s.at ? when(s.at, true) : '', s.key === 'shipped' && tr.number ? 'товарителница ' + tr.number : ''].filter(Boolean).join(' · ');
      return '<li class="' + cls + '"><span class="d">' + (s.done && cls !== 'now' ? '✓' : i + 1) + '</span><div><b>' + esc(L[s.key] || s.key) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>';
  }
  function contact(d) {
    var tr = d.tracking, out = '';
    if (tr.shopPhone) out += '<a class="btn" href="tel:' + esc(tr.shopPhone.replace(/[^\d+]/g, '')) + '">📞 ' + esc(d.shop) + '</a>';
    if (tr.trackUrl) out += '<a class="btn" href="' + esc(tr.trackUrl) + '" target="_blank" rel="noopener">Сайтът на ' + esc(tr.courierName) + ' ↗</a>';
    return out ? '<div class="btns">' + out + '</div>' : '';
  }
  function askBox(d) {
    if (!d.canAnswer) return '';
    return '<div class="ask"><div class="where">📦 Доставка: ' + esc(d.delivery) + '</div>' +
      '<button class="yes" data-a="yes">✓ Потвърждавам поръчката</button><button class="no" data-a="no">Отказвам поръчката</button><div class="err" id="err"></div></div>';
  }
  function render(d, justAnswered) {
    var head = '<div class="shop">' + esc(d.shop) + '</div><h1>' + (d.name ? 'Здравейте, ' + esc(d.name) + '!' : 'Здравейте!') + '</h1>' +
      '<div class="muted">Поръчка от ' + esc(when(d.createdAt)) + ' · ' + esc(money(d.total, d.currency)) + (d.cod ? ' с наложен платеж' : '') + '</div>';
    var thanks = justAnswered === 'yes' ? '<div class="state end"><span class="ic">✅</span><div><b>Благодарим! Поръчката е потвърдена.</b><span class="muted">' + esc(d.shop) + ' ще я изпрати скоро.</span></div></div>' : '';
    card.innerHTML = head + askBox(d) + (thanks || stateBox(d)) + officeBox(d.tracking) + contact(d) + '<h2>Къде е поръчката</h2>' + timeline(d) +
      '<h2>Какво поръча</h2><ul class="items">' + d.items.map(function (it) { return '<li><span>' + esc(it.name) + '</span><span>× ' + esc(it.qty) + '</span></li>'; }).join('') + '</ul>' +
      '<div class="total"><span>Общо' + (d.cod ? ' (с наложен платеж)' : '') + '</span><span>' + esc(money(d.total, d.currency)) + '</span></div>' +
      '<div class="foot">Страницата се обновява, когато я отвориш отново.</div>';
  }
  function load(justAnswered) {
    return fetch(API + '?t=' + encodeURIComponent(t), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Линкът не е валиден'); return d; }); })
      .then(function (d) { render(d, justAnswered); });
  }
  card.addEventListener('click', function (e) {
    var a = e.target.getAttribute && e.target.getAttribute('data-a'); if (!a) return;
    if (a === 'no' && !window.confirm('Сигурни ли сте, че отказвате поръчката?')) return;
    [].forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = true; });
    fetch(API, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: t, answer: a }) })
      .then(function (r) { return r.json().then(function (x) { if (!r.ok) throw new Error(x.error || 'Грешка'); return x; }); })
      .then(function () { return load(a); })
      .catch(function (err) { var el = document.getElementById('err'); if (el) el.textContent = err.message; [].forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = false; }); });
  });
  load().catch(function (e) { card.innerHTML = '<h1>Линкът не е валиден</h1><p class="muted">' + esc(e.message) + '. Свържете се с магазина.</p>'; });
})();
</script>
</body>
</html>
