<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Поръчки – Да се заобичаме с думи</title>
<style>
:root{--rose:#b0426b;--line:#eadde1;--muted:#6f6266;--bg:#faf7f8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#222}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
main{padding:16px;max-width:1400px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#222}
button{cursor:pointer}
.primary{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f6eef1;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
tr.st-new{background:#fff6f9}
.del{display:block;margin-top:6px;color:#a1122f;border-color:#f3c6cf;background:#fff;font-size:12px;padding:4px 10px}
.del:hover{background:#fdecee}
.dup{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:10px;background:#fde7c8;color:#8a4b00;font-size:11px;font-weight:700}
.nk{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-decoration:none}
.nk-bad{background:#fdecee;color:#a1122f}
.nk-ok{background:#e8f6ec;color:#1d6b35}
.nk-wait{background:#f1edef;color:var(--muted)}
.muted{color:var(--muted);font-size:12px}
.pager{display:flex;gap:8px;align-items:center;margin-top:12px}
#login{max-width:320px;margin:15vh auto;background:#fff;padding:24px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.err{color:#a1122f;min-height:1.2em}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:15px;color:var(--muted)}
.tab.on{background:#f6eef1;color:var(--rose)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rose);border-radius:10px;padding:12px 14px}
.card .label{font-size:12px;color:var(--muted)}
.card .val{font-size:22px;font-weight:700;margin-top:4px}
.card .hint{font-size:11px;color:var(--muted);margin-top:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.panel h2{font-size:14px;margin:0 0 10px}
.panel table{border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;overflow-x:auto;padding-top:6px}
.bar{flex:1 0 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;max-width:48px;background:var(--rose);border-radius:4px 4px 0 0;min-height:2px}
.bar b{font-size:11px}
.bar span{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:800px){table,thead,tbody,tr,td{display:block}thead{display:none}tr{border-bottom:2px solid var(--line)}td{border:0;padding:4px 10px}td[data-label]::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);text-transform:uppercase}}
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Вход в поръчките</h1>
  <input type="password" id="pw" placeholder="Парола" autocomplete="current-password" required>
  <button class="primary">Вход</button>
  <div class="err" id="loginErr"></div>
</form>
<div id="app" hidden>
  <header><div class="tabs"><button type="button" class="tab on" data-view="orders">Поръчки</button><button type="button" class="tab" data-view="dash">Табло</button></div><span class="muted" id="count"></span></header>
  <main>
    <section id="dashView" hidden>
      <form class="filters" id="dFilters">
        <select id="dPeriod">
          <option value="today">Днес</option><option value="yesterday">Вчера</option><option value="7" selected>Последните 7 дни</option>
          <option value="30">Последните 30 дни</option><option value="month">Този месец</option><option value="custom">По избор</option>
        </select>
        <input type="date" id="dFrom" title="От дата" hidden>
        <input type="date" id="dTo" title="До дата" hidden>
        <select id="dStore"><option value="">Всички магазини</option></select>
        <button class="primary">Покажи</button>
      </form>
      <div class="cards" id="dCards"></div>
      <div class="panel"><h2>Поръчки по дни</h2><div class="chart" id="dChart"></div></div>
      <div class="grid2">
        <div class="panel"><h2>Топ продукти</h2><table id="dTop"></table></div>
        <div class="panel"><h2>Последни поръчки</h2><table id="dRecent"></table></div>
      </div>
      <div class="grid2">
        <div class="panel"><h2>По вид доставка</h2><table id="dDelivery"></table></div>
        <div class="panel"><h2>По статус</h2><table id="dStatus"></table></div>
      </div>
    </section>
    <section id="ordersView">
    <form class="filters" id="filters">
      <select id="fStatus"><option value="">Всички статуси</option></select>
      <input type="date" id="fFrom" title="От дата">
      <input type="date" id="fTo" title="До дата">
      <input type="search" id="fQ" placeholder="Име или телефон">
      <button class="primary">Търси</button>
      <button type="button" id="csv">Експорт CSV</button>
    </form>
    <table>
      <thead><tr><th>Дата</th><th>Клиент</th><th>Доставка</th><th>Артикули</th><th>Сума</th><th>Статус</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager"><button id="prev" type="button">‹ Назад</button><span id="pageInfo" class="muted"></span><button id="next" type="button">Напред ›</button></div>
    </section>
  </main>
</div>
<script>
(function () {
  var STATUSES = [['new', 'Нова'], ['confirmed', 'Потвърдена'], ['shipped', 'Изпратена'], ['delivered', 'Доставена'], ['returned', 'Върната'], ['cancelled', 'Отказана']];
  var page = 1, pageSize = 50, total = 0, orders = [];
  var current = { status: '', from: '', to: '', q: '' };
  var reqId = 0, loading = false, shown = false;
  function $(id) { return document.getElementById(id); }
  /** nekorekten.com check: red with a link to the first report, green when clean, grey while unchecked */
  function nkBadge(o) {
    if (o.nkStatus === 'flagged') {
      var id = (o.nkReportIds || [])[0];
      var label = '⚠️ ' + o.nkCount + (o.nkCount === 1 ? ' сигнал' : ' сигнала') + ' в НЕкоректен';
      return id ? '<a class="nk nk-bad" target="_blank" rel="noopener" href="https://nekorekten.com/reports/' + encodeURIComponent(id) + '">' + esc(label) + '</a>' : '<span class="nk nk-bad">' + esc(label) + '</span>';
    }
    if (o.nkStatus === 'clean') return '<span class="nk nk-ok">✓ НЕкоректен: няма сигнали</span>';
    return '<span class="nk nk-wait" title="Проверката ще се повтори автоматично">НЕкоректен: непроверен</span>';
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  STATUSES.forEach(function (s) { $('fStatus').insertAdjacentHTML('beforeend', '<option value="' + s[0] + '">' + s[1] + '</option>'); });

  function snapshot() {
    current = { status: $('fStatus').value, from: $('fFrom').value, to: $('fTo').value, q: $('fQ').value.trim() };
  }
  function filters() {
    var p = new URLSearchParams();
    if (current.status) p.set('status', current.status);
    if (current.from) p.set('from', current.from);
    if (current.to) p.set('to', current.to);
    if (current.q) p.set('q', current.q);
    return p;
  }
  function showLogin() { $('app').hidden = true; $('login').hidden = false; $('pw').focus(); }
  function updatePager() {
    var pages = Math.max(1, Math.ceil(total / pageSize));
    $('pageInfo').textContent = 'Стр. ' + page + ' от ' + pages;
    $('prev').disabled = loading || page <= 1;
    $('next').disabled = loading || page >= pages;
  }
  function showLoadError() {
    $('login').hidden = true; $('app').hidden = false;
    $('count').textContent = '';
    $('rows').innerHTML = '<tr><td colspan="7" class="err">Грешка при зареждане. <button type="button" data-retry="1">Опитай пак</button></td></tr>';
    updatePager();
  }
  function load(requestedPage) {
    var target = requestedPage || 1;
    var p = filters(); p.set('page', target);
    var id = ++reqId;
    loading = true; updatePager();
    fetch('/api/admin/orders?' + p, { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 401) return null;
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (d) {
        if (id !== reqId) return;
        if (!d) { showLogin(); return; }
        page = target;
        orders = d.orders; total = d.total; pageSize = d.pageSize;
        shown = true;
        $('login').hidden = true; $('app').hidden = false;
        render();
      })
      .catch(function () {
        if (id !== reqId) return;
        if (!shown) showLoadError();
        else alert('Грешка при зареждане. Опитайте пак.');
      })
      .then(function () {
        if (id !== reqId) return;
        loading = false; updatePager();
      });
  }
  function render() {
    $('count').textContent = total + ' поръчки';
    $('rows').innerHTML = orders.map(function (o, i) {
      var date = new Date(o.createdAt).toLocaleString('bg-BG', { timeZone: 'Europe/Sofia', day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
      var items = o.items.map(function (it) { return esc(it.qty + ' × ' + it.name); }).join('<br>');
      var opts = STATUSES.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === o.status ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('');
      return '<tr class="st-' + esc(o.status) + '">' +
        '<td data-label="Дата">' + esc(date) + '</td>' +
        '<td data-label="Клиент"><b>' + esc(o.name || '—') + '</b>' + (o.isDuplicate ? '<span class="dup" title="Същият телефон в последните 24 ч">дубликат?</span>' : '') +
          '<br><a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a>' + (o.email ? '<br><span class="muted">' + esc(o.email) + '</span>' : '') +
          '<br>' + nkBadge(o) + '</td>' +
        '<td data-label="Доставка">' + esc(o.officeText) + '<br><span class="muted">' + esc(o.city) + (o.postCode ? ' ' + esc(o.postCode) : '') + '</span></td>' +
        '<td data-label="Артикули">' + items + '</td>' +
        '<td data-label="Сума"><b>' + o.total.toFixed(2) + ' ' + esc(o.currency) + '</b></td>' +
        '<td data-label="Статус"><select data-status="' + i + '">' + opts + '</select></td>' +
        '<td><button type="button" data-copy="' + i + '">Копирай за товарителница</button><button type="button" class="del" data-del="' + i + '" title="Изтрий поръчката от системата">Изтрий</button></td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="7" class="muted">Няма поръчки.</td></tr>';
    updatePager();
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('login').querySelector('button');
    $('loginErr').textContent = '';
    btn.disabled = true;
    fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) })
      .then(function (r) {
        if (r.ok) { $('pw').value = ''; load(page); }
        else if (r.status === 401) $('loginErr').textContent = 'Грешна парола.';
        else $('loginErr').textContent = 'Грешка на сървъра. Опитайте пак.';
      })
      .catch(function () { $('loginErr').textContent = 'Няма връзка със сървъра. Опитайте пак.'; })
      .then(function () { btn.disabled = false; });
  });
  $('filters').addEventListener('submit', function (e) { e.preventDefault(); snapshot(); load(1); });
  $('csv').addEventListener('click', function () { location.href = '/api/admin/orders?' + filters() + '&format=csv'; });
  $('prev').addEventListener('click', function () { load(page - 1); });
  $('next').addEventListener('click', function () { load(page + 1); });
  $('rows').addEventListener('change', function (e) {
    var i = e.target.getAttribute('data-status');
    if (i == null) return;
    var o = orders[i], prev = o.status, next = e.target.value;
    fetch('/api/admin/orders', { method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id, status: next }) })
      .then(function (r) {
        if (r.status === 401) { e.target.value = prev; showLogin(); return; }
        if (!r.ok) throw new Error(r.status);
        o.status = next; e.target.closest('tr').className = 'st-' + next;
      })
      .catch(function () { e.target.value = prev; alert('Статусът не беше записан. Опитайте пак.'); });
  });
  $('rows').addEventListener('click', function (e) {
    var btn = e.target;
    if (btn.getAttribute('data-retry') != null) { load(page); return; }
    var d = btn.getAttribute('data-del');
    if (d != null) {
      var o = orders[d];
      if (!window.confirm('Да изтрия ли поръчката на ' + (o.name || 'клиент без име') + ' (' + o.total.toFixed(2) + ' ' + o.currency + ')?\n\nТя ще изчезне само от тази система (не и от ConvertBuilder) и не може да се върне.')) return;
      btn.disabled = true;
      fetch('/api/admin/orders', { method: 'DELETE', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) })
        .then(function (r) {
          if (r.status === 401) { showLogin(); return; }
          if (!r.ok && r.status !== 404) throw new Error(r.status);
          orders.splice(Number(d), 1); total = Math.max(0, total - 1); render();
        })
        .catch(function () { btn.disabled = false; alert('Поръчката не беше изтрита. Опитайте пак.'); });
      return;
    }
    var i = btn.getAttribute('data-copy');
    if (i == null) return;
    var text = orders[i].waybill;
    function fallback() { window.prompt('Копирайте текста ръчно:', text); }
    function done() {
      btn.textContent = 'Копирано ✓';
      setTimeout(function () { btn.textContent = 'Копирай за товарителница'; }, 1500);
    }
    if (!navigator.clipboard || !navigator.clipboard.writeText) { fallback(); return; }
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  });

  snapshot();
  /* ---- Табло ---- */
  var DELIVERY = { econt_office: 'Еконт – офис', speedy_office: 'Спиди – офис', speedy_address: 'Спиди – адрес' };
  var STATUS_LABEL = {};
  STATUSES.forEach(function (s) { STATUS_LABEL[s[0]] = s[1]; });
  var dashLoaded = false;
  function sofiaDay(offset) { return new Date(Date.now() + offset * 864e5).toLocaleDateString('sv-SE', { timeZone: 'Europe/Sofia' }); }
  function periodRange(v) {
    var t = sofiaDay(0);
    if (v === 'today') return [t, t];
    if (v === 'yesterday') return [sofiaDay(-1), sofiaDay(-1)];
    if (v === '30') return [sofiaDay(-29), t];
    if (v === 'month') return [t.slice(0, 8) + '01', t];
    if (v === 'custom') return [$('dFrom').value || t, $('dTo').value || t];
    return [sofiaDay(-6), t];
  }
  function cur(c) { return c === 'EUR' ? '€' : c === 'USD' ? '$' : c; }
  function money(amount, currency) { return amount.toFixed(2).replace('.', ',') + ' ' + cur(currency); }
  function moneyList(list) { return list && list.length ? list.map(function (m) { return money(m.amount, m.currency); }).join(' + ') : '—'; }
  function pct(v) { return v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%'; }
  function card(label, val, hint) {
    return '<div class="card"><div class="label">' + esc(label) + '</div><div class="val">' + esc(val) + '</div>' + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
  }
  /** cells must already be escaped */
  function table(head, rows) {
    return '<thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (rows.length ? rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('')
        : '<tr><td colspan="' + head.length + '" class="muted">Няма данни.</td></tr>') + '</tbody>';
  }
  function renderDash(d) {
    dashLoaded = true;
    var sel = $('dStore'), chosen = sel.value;
    sel.innerHTML = '<option value="">Всички магазини</option>' + d.stores.map(function (st) {
      return '<option value="' + esc(st) + '"' + (st === chosen ? ' selected' : '') + '>' + esc(st) + '</option>';
    }).join('');
    var c = d.cards, period = d.period.from === d.period.to ? d.period.from : d.period.from + ' – ' + d.period.to;
    $('dCards').innerHTML = card('Оборот', moneyList(c.revenue), 'без отказаните') + card('Реален приход', moneyList(c.delivered), 'само доставените') +
      card('Поръчки', String(c.orders), period) + card('Средна поръчка (AOV)', moneyList(c.aov)) +
      card('Върнати', pct(c.returnRate), 'от изпратените') + card('⚠️ В НЕкоректен', String(c.nkFlagged), pct(c.nkFlaggedPct) + ' от поръчките');
    var max = Math.max.apply(null, d.daily.map(function (x) { return x.orders; }).concat([1]));
    $('dChart').innerHTML = d.daily.length ? d.daily.map(function (x) {
      return '<div class="bar" title="' + esc(x.day + ': ' + x.orders + ' поръчки, оборот ' + x.revenue.toFixed(2)) + '"><b>' + x.orders + '</b>' +
        '<i style="height:' + Math.round(x.orders / max * 120) + 'px"></i><span>' + esc(x.day.slice(8) + '.' + x.day.slice(5, 7)) + '</span></div>';
    }).join('') : '<div class="muted">Няма поръчки за периода.</div>';
    $('dTop').innerHTML = table(['Продукт', 'Бройки', 'Оборот'], d.topProducts.map(function (t) { return [esc(t.name), String(t.qty), esc(t.revenue.toFixed(2).replace('.', ','))]; }));
    $('dRecent').innerHTML = table(['Дата', 'Клиент', 'Сума', 'Статус'], d.recent.map(function (o) {
      var dt = new Date(o.createdAt).toLocaleString('bg-BG', { timeZone: 'Europe/Sofia', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      return [esc(dt), esc(o.name), esc(money(o.total, o.currency)), esc(STATUS_LABEL[o.status] || o.status)];
    }));
    $('dDelivery').innerHTML = table(['Доставка', 'Поръчки', 'Оборот'], d.byDelivery.map(function (x) { return [esc(DELIVERY[x.deliveryType] || x.deliveryType), String(x.orders), esc(x.revenue.toFixed(2).replace('.', ','))]; }));
    $('dStatus').innerHTML = table(['Статус', 'Поръчки'], d.byStatus.map(function (x) { return [esc(STATUS_LABEL[x.status] || x.status), String(x.orders)]; }));
  }
  function loadDash() {
    var r = periodRange($('dPeriod').value), p = new URLSearchParams({ from: r[0], to: r[1] });
    if ($('dStore').value) p.set('store', $('dStore').value);
    $('dCards').innerHTML = '<div class="muted">Зареждане…</div>';
    fetch('/api/admin/stats?' + p, { credentials: 'same-origin' })
      .then(function (res) { if (res.status === 401) { showLogin(); return null; } if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (d) { if (d) renderDash(d); })
      .catch(function () { $('dCards').innerHTML = '<div class="err">Грешка при зареждане на таблото. Опитайте пак.</div>'; });
  }
  function showView(view) {
    [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t.getAttribute('data-view') === view); });
    $('ordersView').hidden = view !== 'orders';
    $('dashView').hidden = view !== 'dash';
    $('count').hidden = view !== 'orders';
    if (view === 'dash' && !dashLoaded) loadDash();
  }
  [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.addEventListener('click', function () { showView(t.getAttribute('data-view')); }); });
  $('dPeriod').addEventListener('change', function () { var custom = $('dPeriod').value === 'custom'; $('dFrom').hidden = !custom; $('dTo').hidden = !custom; if (!custom) loadDash(); });
  $('dStore').addEventListener('change', loadDash);
  $('dFilters').addEventListener('submit', function (e) { e.preventDefault(); loadDash(); });

  load(1);
})();
</script>
</body>
</html>
