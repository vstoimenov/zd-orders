# A local WordPress + WooCommerce to test the Ordyx plugin: DOCKER_CONFIG=/tmp/dockercfg docker-compose up -d && bash setup.sh
# WordPress: http://localhost:8080 (admin / admin-local-1). It talks to the local Ordyx (node dev/admin-local.mjs, port 8766).
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_CONFIG_EXTRA: |
        define('ORDYX_API_URL', 'http://host.docker.internal:8766');
        define('ORDYX_BROWSER_URL', 'http://localhost:8766');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - wp:/var/www/html
      - ../../integrations/woocommerce/ordyx:/var/www/html/wp-content/plugins/ordyx
  cli:
    image: wordpress:cli-php8.3
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      # the image reads this at runtime (wp-config-docker.php), so the CLI needs it too
      WORDPRESS_CONFIG_EXTRA: |
        define('ORDYX_API_URL', 'http://host.docker.internal:8766');
        define('ORDYX_BROWSER_URL', 'http://localhost:8766');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - wp:/var/www/html
      - ../../integrations/woocommerce/ordyx:/var/www/html/wp-content/plugins/ordyx
    entrypoint: ["sleep", "infinity"]
volumes:
  db:
  wp:
