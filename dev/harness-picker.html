<!doctype html>
<!-- The picker as another platform (the WooCommerce plugin) mounts it: python3 -m http.server 8765 → http://localhost:8765/dev/harness-picker.html
     ?boxnow=off → the shop has not switched BOX NOW on. Same fixtures as harness.html. -->
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordyx picker — standalone harness</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; color: #222; }
  label { display: block; margin: 0 0 12px; font-size: 14px; }
  select { font-size: 16px; padding: 6px 10px; }
  #out { background: #f4f4f1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #err { color: #b91c1c; font-weight: 600; margin: 8px 0; }
</style>
<script>
  var FIX_OFFICES = [
    { id: 'econt:4001', code: '4001', name: 'Пловдив Център', city: 'Пловдив', postCode: '4000', address: 'ул. Гладстон 1', isAutomat: false, lat: 42.1419, lng: 24.7497, hours: 'пн–пт 09:00–18:00 · сб 09:00–15:00' },
    { id: 'econt:4002', code: '4002', name: 'Тракия', city: 'Пловдив', postCode: '4000', address: 'бул. Освобождение 31', isAutomat: true, lat: 42.1366, lng: 24.7811, hours: '24/7' },
    { id: 'econt:1001', code: '1001', name: 'Лозенец', city: 'София', postCode: '1000', address: 'ул. Бяла черква 2', isAutomat: false, lat: 42.6734, lng: 23.3191, hours: 'пн–пт 09:00–18:00' }
  ];
  var FIX_SPEEDY = [
    { id: 'speedy:79', code: '79', name: 'ПЛОВДИВ - ОФИС', city: 'Пловдив', postCode: '', address: '', isAutomat: false }
  ];
  var FIX_BOXNOW = [
    { id: 'boxnow:1840', code: '1840', name: 'New Avenue, ул. Проф. Храбър Попов 14, София - 24/7', city: 'София', postCode: '1700', address: 'ул. Проф. арх. Храбър Попов №14', isAutomat: true, lat: 42.6448, lng: 23.3397, hours: '24/7' }
  ];
  var FIX_CITIES = [{ id: 1, name: 'Варна', postCode: '9000', region: 'Варна', hasOffice: true }, { id: 3, name: 'Долни Воден', postCode: '4000', region: 'Пловдив', hasOffice: false }];
  window.__zdoLogoBase = 'https://kurier.profitbrand.online/logos/';
  var realFetch = window.fetch.bind(window);
  window.fetch = function (url, init) {
    var raw = url;
    url = typeof url === 'string' ? url : (url && url.url) || String(url);
    var reply = function (status, data) { return Promise.resolve(new Response(JSON.stringify(data), { status: status })); };
    if (url.indexOf('courier=shop') > -1) return reply(200, { boxnow: !/[?&]boxnow=off/.test(location.search), eta: { econt: '1–2 работни дни', speedy: '', boxnow: 'до 24 часа' } });
    if (url.indexOf('/api/offices') > -1) return reply(200, { offices: url.indexOf('courier=speedy') > -1 ? FIX_SPEEDY : url.indexOf('courier=boxnow') > -1 ? (/[?&]boxnow=off/.test(location.search) ? [] : FIX_BOXNOW) : FIX_OFFICES });
    if (url.indexOf('/api/cities') > -1) return reply(200, { cities: FIX_CITIES });
    if (url.indexOf('/api/visit') > -1) return reply(200, {});
    return realFetch(raw, init);
  };
</script>
<script src="/public/checkout.js" defer></script>
</head>
<body>
<h1>Избор на доставка (както в WooCommerce)</h1>
<label>Метод на доставка (това е списъкът на платформата)
  <select id="type">
    <option value="">— изберете —</option>
    <option value="econt_office">Еконт – офис / автомат</option>
    <option value="speedy_office">Спиди – офис / автомат</option>
    <option value="speedy_address">Спиди – адрес</option>
    <option value="boxnow_locker">BOX NOW – автомат</option>
  </select>
</label>
<div id="picker"></div>
<div id="err"></div>
<h2 style="font-size:14px">onChange</h2>
<div id="out">—</div>
<script>
  window.addEventListener('load', function () {
    var handle = window.OrdyxPicker.mount(document.getElementById('picker'), {
      api: '', host: 'adhdbg.eu', type: '',
      onChange: function (v) { window.__last = v; document.getElementById('out').textContent = JSON.stringify(v, null, 2); }
    });
    window.__picker = handle;
    document.getElementById('type').addEventListener('change', function (e) { handle.setType(e.target.value); });
    document.getElementById('err').textContent = '';
  });
</script>
</body>
</html>
